# SSSB's one way onto npm (ADR-0014 part 10, D11). Every package's npm trusted publisher names THIS FILE,
# `release.yml`, so renaming it stops every publish until each publisher is edited. Modeled on CanopyCMS's
# publish.yml.
#
# A release is two runs of this file, each in two jobs:
#   1. a push to `main` runs `plan`, which waits for `checks` to pass on that merge commit and versions the
#      pending changesets with Changesets, and then `push`, which checks that result and pushes it as a release
#      commit and its `vX.Y.Z` tag;
#   2. that tag's push runs `pack`, which waits for `checks` to pass on the release commit and packs, and then
#      `publish`, which publishes the packed tarballs with provenance.
# Each pair splits the same way: the first job installs the workspace's dependencies and holds no secret; the
# second holds the secret (the release app's key in `push`, npm's id-token in `publish`), installs nothing, and
# re-checks what the first handed it. No job holds both a token that writes to the repository and the id-token.
#
# NOTHING REACHES NPM BEFORE P14. Every package is `"private": true` until then, so Changesets plans no
# release (`privatePackages.version` is false in .changeset/config.json), `plan` reports none and `push` is
# skipped, and on a tag `pack` finds nothing publishable and `publish` is skipped. As a third lock, `publish`
# refuses any tarball whose own manifest says private. Do not count on npm for that: `npm publish <tarball>
# --dry-run` (11.21.2) accepted a private one.
#
# What the repository and npm must hold (JP's settings; none of it is in this file). The workflow names both
# environments, and GitHub creates a named environment that does not exist with no rules at all, so each is set
# up before its secret is added or a trusted publisher names it:
#   - environment `release`: deployment branches `main` only, administrators not exempt; secret
#     RELEASE_BOT_PRIVATE_KEY and variable RELEASE_BOT_CLIENT_ID for the release app (installed on this
#     repository only, contents write), whose token may push to `main` past its rules;
#   - environment `npm-publish`: deployment refs `v*` tags only, administrators not exempt;
#   - a tag ruleset on `v*` that only the release app may create, that nobody may move or delete, with no other
#     bypass. Without it anyone who can push a tag can run an edited copy of this file in `npm-publish`;
#   - `main`'s ruleset: changes through a reviewed PR with `checks` required, only the release app bypassing;
#   - on npmjs.com, per package: a trusted publisher naming `safeinsights/sssb`, `release.yml` and the
#     environment `npm-publish`, with publishing requiring 2FA and disallowing tokens. npm binds the publisher to
#     those three and to no ref (docs.npmjs.com/trusted-publishers), which is why the two rules above carry it.
# `pnpm release-app:init` makes the release app, stores its key and client id, and shows (or with
# `--apply-bypass` makes) the ruleset changes; docs/runbooks/release-app.md is the procedure. A bypass covers
# every rule in its ruleset, so it keeps deletion and force-pushes in rulesets the app does not bypass.
name: release

on:
    push:
        branches: [main]
        tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Every job states its own.
permissions: {}

concurrency:
    group: release-${{ github.ref }}
    # Never cancel a publish part-way, which would leave the set at mixed versions on npm. Queued runs for
    # `main` may still be replaced by a newer one, which carries the same pending changesets.
    cancel-in-progress: false

jobs:
    # The push's first half: everything that needs the workspace's dependencies, with no secret and no write
    # access. Its output is a patch that the `push` job checks before it believes any of it.
    plan:
        name: plan
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            # To list this commit's `checks` runs: workflow runs are the `actions` scope, not `checks`.
            actions: read
        outputs:
            release: ${{ steps.prepare.outputs.release }}
            version: ${{ steps.prepare.outputs.version }}
        env:
            HUSKY: '0'
        steps:
            # Full history and tags: a release never goes behind the latest `vX.Y.Z` tag.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            # No dependency cache: a release builds from the lockfile alone.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            # THE CI GATE (scripts/release.mjs): `checks` must pass on this merge commit, which no PR's run tested.
            # It runs before anything is installed, and its `passed <sha>` line is required, not just its exit code.
            - name: wait for checks to pass on this commit
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  out=$(node scripts/release.mjs wait-for-checks "$GITHUB_SHA")
                  [ "$out" = "passed $GITHUB_SHA" ] || { echo "::error::the CI gate did not report a pass"; exit 1; }

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - run: pnpm install --frozen-lockfile --ignore-scripts

            # scripts/release.mjs prepare: the 0.x checks, the plan, the release notes (assembled from the pending
            # changesets by scripts/release-notes.mjs, and written outside the tree because `changeset version` is about
            # to delete the files they come from), and `changeset version` in the working tree. A changeset that cannot
            # be read as a release-note entry stops it before anything is changed.
            # Until P14 it answers `release: false` on every push, and the run ends here.
            - name: prepare the release
              id: prepare
              run: |
                  set -euo pipefail
                  result=$(node scripts/release.mjs prepare --notes "$RUNNER_TEMP/release-notes.md")
                  echo "$result"
                  release=$(jq -r '.release' <<<"$result")
                  echo "release=$release" >> "$GITHUB_OUTPUT"
                  if [ "$release" = "true" ]; then
                      version=$(jq -r '.version' <<<"$result")
                      [[ "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::not a 0.x release version: '$version'"; exit 1; }
                      echo "version=$version" >> "$GITHUB_OUTPUT"
                      git add -A
                      git diff --cached --binary HEAD > "$RUNNER_TEMP/release.patch"
                      cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "Nothing to release: $(jq -r '.reason' <<<"$result")" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.prepare.outputs.release == 'true'
              with:
                  name: release-patch
                  path: ${{ runner.temp }}/release.patch
                  if-no-files-found: error
                  retention-days: 7

            # The notes for this release, for whoever publishes its GitHub release (P7 and P14). They are not in the
            # patch: the `push` job commits only the version bumps, the deleted changesets and the package changelogs.
            # `node scripts/release-notes.mjs --at "v<version>^" --version <version>` regenerates them from the tag.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.prepare.outputs.release == 'true'
              with:
                  name: release-notes
                  path: ${{ runner.temp }}/release-notes.md
                  if-no-files-found: error
                  retention-days: 90

    # The push's second half, and the only job that can reach the release app's key. It installs nothing and runs
    # no dependency's code, so nothing `plan` ran can reach this job's environment, steps or token; and it
    # believes nothing `plan` says until scripts/release.mjs verify-release has checked the staged result.
    push:
        name: push
        needs: plan
        if: needs.plan.outputs.release == 'true'
        runs-on: ubuntu-latest
        # Holds the release app's key. Its deployment rule (JP's setting, at the top) allows `main` only, so a
        # workflow on any other branch cannot mint the app's token.
        environment: release
        permissions:
            # The release app's token does the writing.
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-patch
                  path: ${{ runner.temp }}/release

            # The checker is copied out of the commit first, so a patch that rewrote it would not be the code that
            # judges it. verify-release works out from HEAD alone which changesets must go and what version they
            # imply, and anything else in the patch fails here, before a token exists. Its `verified <version>` line
            # is required, not just its exit code.
            - name: apply, check, commit and tag the release
              env:
                  VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  set -euo pipefail
                  [[ "$VERSION" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::not a 0.x release version: '$VERSION'"; exit 1; }
                  cp scripts/release.mjs "$RUNNER_TEMP/release.mjs"
                  git apply --index "$RUNNER_TEMP/release/release.patch"
                  out=$(node "$RUNNER_TEMP/release.mjs" verify-release "$VERSION")
                  [ "$out" = "verified $VERSION" ] || { echo "::error::verify-release did not report a pass"; exit 1; }
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git -c core.hooksPath=/dev/null commit --no-verify -m "chore: release v$VERSION"
                  git tag "v$VERSION"

            # The release app's token, from its key in this job's `release` environment. The generic GITHUB_TOKEN
            # would not do: GitHub starts no workflow run for a push made with it, so its tag would never publish.
            # The token is asked for exactly the App's permissions (scripts/release-app/manifest.ts), so an App
            # widened later still mints nothing wider here. tests/tooling/release-app-drift.test.ts holds the two
            # together and pins this job by hash, so any edit to it fails until it is re-reviewed.
            - name: mint the release app's token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
                  permission-contents: write

            # The push goes from a fresh repository, ignoring global and system config, with hooks off and the token
            # only in this step, in a header and masked. `--atomic` lands the commit and its tag together or not at
            # all: if main moved, nothing is pushed and the next push to main releases the changesets still pending.
            - name: push the release
              env:
                  VERSION: ${{ needs.plan.outputs.version }}
                  TOKEN: ${{ steps.app-token.outputs.token }}
                  GIT_CONFIG_GLOBAL: /dev/null
                  GIT_CONFIG_NOSYSTEM: '1'
              run: |
                  set -euo pipefail
                  sha=$(git rev-parse HEAD)
                  pusher=$(mktemp -d)
                  git init -q "$pusher"
                  git -C "$pusher" -c core.hooksPath=/dev/null fetch -q "$GITHUB_WORKSPACE" \
                      "+$sha:refs/heads/release" "+refs/tags/v$VERSION:refs/tags/v$VERSION"
                  auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
                  echo "::add-mask::$auth"
                  git -C "$pusher" -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $auth" \
                      push --no-verify --atomic "https://github.com/$GITHUB_REPOSITORY" release:main "refs/tags/v$VERSION"
                  echo "Released v$VERSION at $sha" >> "$GITHUB_STEP_SUMMARY"

    # The tag's first half: everything that needs the workspace's dependencies, with no id-token.
    pack:
        name: pack
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            # The CI gate lists this commit's `checks` runs.
            actions: read
        outputs:
            version: ${{ steps.tag.outputs.version }}
            count: ${{ steps.list.outputs.count }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Only a release commit on main publishes. A `vX.Y.Z` tag anywhere else stops here.
            - name: check the tag is a release on main
              id: tag
              run: |
                  set -euo pipefail
                  [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$GITHUB_REF_NAME is not a release tag"; exit 1; }
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
                  echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            # THE CI GATE again, on the release commit itself, so what is published is what `checks` passed
            # (ADR-0014 part 10 asks for both apps and pack and consume, `checks`' own jobs, green on that commit).
            - name: wait for checks to pass on the release commit
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  out=$(node scripts/release.mjs wait-for-checks "$GITHUB_SHA")
                  [ "$out" = "passed $GITHUB_SHA" ] || { echo "::error::the CI gate did not report a pass"; exit 1; }

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - run: pnpm install --frozen-lockfile --ignore-scripts

            # Every non-private workspace package, each in the fixed group at the tag's version. Until P14 the list
            # is empty, and this run ends here with nothing published.
            - name: list what this tag publishes
              id: list
              env:
                  VERSION: ${{ steps.tag.outputs.version }}
              run: |
                  set -euo pipefail
                  list=$(node scripts/release.mjs publishable "$VERSION")
                  count=$(jq length <<<"$list")
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  if [ "$count" -eq 0 ]; then
                      echo "v$VERSION publishes nothing: every package is private (ADR-0014 P14 makes them public)." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  # The tag must be the commit that set the version, not a later one still carrying it.
                  for dir in $(jq -r '.[].dir' <<<"$list"); do
                      before=$(git show "HEAD^:$dir/package.json" 2>/dev/null | jq -r .version || true)
                      [ "$before" != "$VERSION" ] || { echo "::error::$dir was already at $VERSION before this commit; v$VERSION must tag the release commit"; exit 1; }
                  done
                  mkdir -p "$RUNNER_TEMP/tarballs"
                  for dir in $(jq -r '.[].dir' <<<"$list"); do
                      (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
                  done

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.list.outputs.count != '0'
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    # The tag's second half, and the only job holding npm's id-token. It checks out three files, installs nothing
    # and runs none of the workspace's dependencies (its one fetched program is the pinned npm), so a compromised
    # dependency in `pack` never sees the token. It re-checks each tarball itself rather than trusting `pack`.
    publish:
        name: publish
        needs: pack
        if: needs.pack.outputs.count != '0'
        runs-on: ubuntu-latest
        # npm's trusted publisher names this environment, and its deployment rule admits `v*` tags only (both JP's
        # settings, listed at the top).
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: |
                      .nvmrc
                      .changeset/config.json
                      scripts/release.mjs
                  sparse-checkout-cone-mode: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  registry-url: 'https://registry.npmjs.org'
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs

            # Before the first publish: each tarball is a fixed-group package at this version and not private, and
            # one already on npm from this commit is skipped, so "Re-run failed jobs" resumes a release that stopped
            # part-way. Anything else fails here, with nothing published.
            #
            # npm runs as `npx npm@11.21.2`: trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/
            # trusted-publishers), the exact version is pinned rather than floated, and npx checks the fetched npm
            # against the registry's sha512. Keep it at 11.5.1 or later when bumping.
            - name: publish
              env:
                  VERSION: ${{ needs.pack.outputs.version }}
              run: |
                  set -euo pipefail
                  todo=$(node scripts/release.mjs preflight "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP"/tarballs/*.tgz)
                  echo "to publish: $todo"
                  for file in $(jq -r '.[].file' <<<"$todo"); do
                      npx --yes npm@11.21.2 publish "$file" --access public --provenance
                  done
                  echo "Published v$VERSION: $(jq -r '[.[].name] | join(", ")' <<<"$todo")" >> "$GITHUB_STEP_SUMMARY"
