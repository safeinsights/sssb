# Hermetic checks — no cloud credentials, everything runs on fakes.
#
# pull_request validates every PR (against the merge commit, and for forks); push covers
# post-merge validation on main. Feature branches without a PR rely on the local `pnpm verify`
# gate (see /pre-pr) — this avoids running the whole suite twice on same-repo PRs.
name: checks

on:
    push:
        branches: [main]
    pull_request:

# Least privilege: nothing by default, and each job below states its own. None needs more than a read of the
# repository (the checkout); release.yml trusts this workflow's result as its gate, so a job that could write
# would be a way into a release. Adding a write permission to a job here is a decision for review, not a default.
permissions: {}

concurrency:
    # A PR's newer push cancels its older run. A push to main never does: release.yml waits for this workflow to
    # pass on each merge commit and on each release commit, and a cancelled run there would hold a release back.
    group: checks-${{ github.event_name == 'push' && github.sha || github.ref }}
    cancel-in-progress: true

jobs:
    # SSSB's checks for both apps, through the REUSABLE WORKFLOW an adopter's own CI calls (app-checks.yml, ADR-0014
    # P10), so every app-side job is proved here before an adopter runs it: lint, typecheck and unit tests with
    # `sssb check-fences` in each app, the contract tests on real Postgres, the e2e shards, each app's static demo, each
    # app's CDK synth, and `all-checks`, which fails unless every one of them ran and passed. Called by its local path,
    # so it runs at the commit under test; an adopter pins it by commit SHA. No `apps` input: the workspace's apps are
    # discovered (every apps/<name>), so `pnpm init-app`'s rename and eject need no edit here. Its checks are named
    # `sssb / <job>`: GitHub prefixes a called workflow's jobs with the caller's job name.
    # tests/tooling/app-checks-workflow.test.ts holds this call to that shape.
    sssb:
        uses: ./.github/workflows/app-checks.yml
        permissions:
            contents: read
        with:
            synth: ./apps/*/infra

    # What only this repository checks, beside the app checks: the bidi-character scan, dead code (knip), duplication
    # (jscpd) and the spike's own suite. Each app's infra/ and spikes/ sit outside the root TS program and jscpd;
    # docs/provenance.md cites the spike as the harness that de-risked ADR-0004 before anything was built on it, which
    # makes it doc-load-bearing with no other guard.
    repo-checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash .github/scripts/check-bidi.sh
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm knip
            - run: pnpm jscpd
            - run: pnpm --filter spike-kysely-pglite test

    # ADR-0014 part 10: on 0.x a breaking change is a `minor`, because Changesets turns a `major` into 1.0.0 and
    # npm versions cannot be withdrawn. Fails on a `major` changeset and on any release plan reaching 1.0.0,
    # judged as the plan will be once the packages are public, and on changesets or packages that would stall a
    # release later (scripts/release.mjs, `check`). release.yml runs the same check again before it versions
    # anything.
    release-plan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm release:check

    # A PR that changes what SSSB hands an adopter (every `@sssb/*` package's shipped files, today the kit, and the starter) adds a changeset: its
    # release-note entry, which ADR-0014 P7's notes are assembled from. Path-based, because every package is private
    # until P14 and `changeset status` ignores private packages. The script, its exemptions and its tests:
    # .github/scripts/require-changeset.sh, tests/tooling/changesets.test.ts. A newer push to the PR re-runs it, so
    # adding the file turns it green.
    changeset-required:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The gate diffs from the merge-base and reads when the gate reached the base branch.
                  fetch-depth: 0
            - name: Require a changeset
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
                  CREATED_AT: ${{ github.event.pull_request.created_at }}
                  ACTOR: ${{ github.event.pull_request.user.login }}
                  HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                  REPO: ${{ github.repository }}
              run: bash .github/scripts/require-changeset.sh

    # Adoption is advertised as one command (docs/adopting.md) and had no automated coverage at all —
    # this proves `pnpm init-app` actually works, end to end, on the harshest path it supports
    # (renaming AND ejecting the showcase in one call).
    #
    # The copy lives OUTSIDE /tmp on purpose, to match the documented local reproduction exactly
    # (.claude/future-tasks/resolved/adoption-probe-not-under-tmp.md): on macOS, /tmp is a symlink to
    # /private/tmp, so a workspace package's module graph resolves under both spellings and the request
    # handler ends up holding a different `next/headers` instance than the fake auth adapter, which
    # breaks `cookies()`. `runner.temp` is never under /tmp on either GitHub-hosted OS, so this specific
    # bug cannot bite Linux CI today — but probing this way keeps the job correct if it is ever run on a
    # macOS runner, rather than quietly relying on a Linux-only accident.
    adoption-probe:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # PROBE_DIR is exported here rather than declared in a job-level `env:`, because the
            # `runner` context is NOT available at that level (only github/needs/strategy/matrix/
            # vars/secrets/inputs are) and referencing it there fails the whole workflow at STARTUP —
            # zero jobs, no checks on the PR, and a YAML parser reports nothing wrong.
            - name: copy the checkout to a scratch dir outside /tmp
              run: |
                  echo "PROBE_DIR=$RUNNER_TEMP/adoption-probe" >> "$GITHUB_ENV"
                  cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/adoption-probe"
            - name: pnpm install
              run: pnpm install
              working-directory: ${{ env.PROBE_DIR }}
            # Same cache the e2e/demo-static jobs use — `pnpm verify` below runs the full e2e suite.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            - run: pnpm exec playwright install --with-deps chromium
              working-directory: ${{ env.PROBE_DIR }}
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            - run: pnpm exec playwright install-deps chromium
              working-directory: ${{ env.PROBE_DIR }}
              if: steps.playwright-cache.outputs.cache-hit == 'true'
            - name: pnpm init-app acme --eject-showcase --yes
              run: pnpm init-app acme --eject-showcase --yes
              working-directory: ${{ env.PROBE_DIR }}
            # --no-frozen-lockfile is REQUIRED here and is not a workaround. `init-app` renames one
            # app and deletes two packages, so the lockfile legitimately no longer matches the
            # workspace — and pnpm defaults frozen-lockfile to TRUE whenever CI is set, which is why
            # this step passes on a laptop and fails here. An adopter hits the benign version of this:
            # they run init-app locally, pnpm rewrites the lockfile, and they commit it.
            - name: pnpm install (the workspace changed)
              run: pnpm install --no-frozen-lockfile
              working-directory: ${{ env.PROBE_DIR }}
            - name: pnpm verify
              run: pnpm verify
              working-directory: ${{ env.PROBE_DIR }}
              env:
                  NEXT_TELEMETRY_DISABLED: '1'
                  E2E_BUILD: '1'
            # `pnpm verify` does not synth the infra. After init-app's rename and eject, each surviving app's
            # infra/ must still synth: SssbApp resolves the migrator from the app's directory and fails the
            # synth unless its bundle carries that app's migrations (packages/cdk, ADR-0014 P9).
            - name: pnpm --filter './apps/*/infra' --fail-if-no-match synth
              run: pnpm --filter './apps/*/infra' --fail-if-no-match synth
              working-directory: ${{ env.PROBE_DIR }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-report-adoption-probe
                  path: ${{ env.PROBE_DIR }}/apps/*/playwright-report/
                  retention-days: 7

    # ADR-0014 rule 5 (P2): the framework as an adopter gets it. Packs @sssb/kit, installs the TARBALL
    # into an adopter-shaped workspace built outside this checkout from copies of apps/starter (two apps
    # with different seams linked by `link:`, a sibling package, and a seamless importer that must fail),
    # and runs that workspace's verify. Inside this repo workspace links and per-app aliases resolve the
    # framework and the seam, which hides exactly what an adopter would hit; every step's logic is in
    # scripts/pack-and-consume.mjs, so `pnpm pack-and-consume` reproduces this job locally.
    #
    # No `pnpm install` of this repo: the job needs only `pnpm pack`. The consumer installs from its own
    # committed lockfile seed (scripts/pack-and-consume/consumer-lock.yaml), so its caches are keyed on
    # that file, under prefixes of their own: sharing setup-node's pnpm cache key would let this job save
    # a store holding only the consumer's packages for every other job to restore.
    pack-and-consume:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            - name: locate the pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pack-and-consume-pnpm-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: pack-and-consume-pnpm-${{ runner.os }}-
            # The consumer's own Playwright, pinned by the same seed, has its own browser revision.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: pack-and-consume-playwright-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: pack-and-consume-playwright-${{ runner.os }}-
            - run: node scripts/pack-and-consume.mjs --dir "$RUNNER_TEMP/pack-and-consume"
            # On CI the starter's Playwright reporter is `github`, so the evidence on a failure is the
            # traces under test-results/ (trace: on-first-retry), not an HTML report.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: pack-and-consume-e2e
                  path: |
                      ${{ runner.temp }}/pack-and-consume/workspace/apps/*/test-results/
                      ${{ runner.temp }}/pack-and-consume/workspace/apps/*/playwright-report/
                  retention-days: 7

    secret-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # full history — a secret committed then deleted is still leaked
            - name: gitleaks (pinned binary; gitleaks-action requires a license key for org repos)
              run: |
                  curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
                  ./gitleaks git --redact --config .gitleaks.toml
