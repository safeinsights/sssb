# Hermetic checks — no cloud credentials, everything runs on fakes.
#
# pull_request validates every PR (against the merge commit, and for forks); push covers
# post-merge validation on main. Feature branches without a PR rely on the local `pnpm verify`
# gate (see /sssb:pre-pr) — this avoids running the whole suite twice on same-repo PRs.
name: checks

on:
    push:
        branches: [main]
    pull_request:

# Least privilege: nothing by default, and each job below states its own. None needs more than a read of the
# repository (the checkout); release.yml trusts this workflow's result as its gate, so a job that could write
# would be a way into a release. Adding a write permission to a job here is a decision for review, not a default.
permissions: {}

concurrency:
    # A PR's newer push cancels its older run. A push to main never does: release.yml waits for this workflow to
    # pass on each merge commit and on each release commit, and a cancelled run there would hold a release back.
    group: checks-${{ github.event_name == 'push' && github.sha || github.ref }}
    cancel-in-progress: true

jobs:
    # SSSB's checks for both apps, through the REUSABLE WORKFLOW an adopter's own CI calls (app-checks.yml, ADR-0014
    # P10), so every app-side job is proved here before an adopter runs it: lint, typecheck and unit tests with
    # `sssb check-fences` and `sssb check-e2e` in each app and one `sssb doctor` run, the contract tests on real Postgres, the e2e shards, each app's static demo, each
    # app's CDK synth, and `all-checks`, which fails unless every one of them ran and passed. Called by its local path,
    # so it runs at the commit under test; an adopter pins it by commit SHA. No `apps` input: the workspace's apps are
    # discovered (every apps/<name>), so adding, renaming or removing an app needs no edit here. Its checks are named
    # `sssb / <job>`: GitHub prefixes a called workflow's jobs with the caller's job name.
    # tests/tooling/app-checks-workflow.test.ts holds this call to that shape.
    sssb:
        uses: ./.github/workflows/app-checks.yml
        permissions:
            contents: read
        with:
            synth: ./apps/*/infra

    # What only this repository checks, beside the app checks: the bidi-character scan, dead code (knip), duplication
    # (jscpd) and the spike's own suite. Each app's infra/ and spikes/ sit outside the root TS program and jscpd;
    # docs/provenance.md cites the spike as the harness that de-risked ADR-0004 before anything was built on it, which
    # makes it doc-load-bearing with no other guard.
    repo-checks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash .github/scripts/check-bidi.sh
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm knip
            - run: pnpm jscpd
            - run: pnpm --filter spike-kysely-pglite test

    # ADR-0014 part 10: on 0.x a breaking change is a `minor`, because Changesets turns a `major` into 1.0.0 and
    # npm versions cannot be withdrawn. Fails on a `major` changeset and on any release plan reaching 1.0.0,
    # judged as the plan will be once the packages are public, and on changesets or packages that would stall a
    # release later (scripts/release.mjs, `check`). release.yml runs the same check again before it versions
    # anything.
    release-plan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm release:check

    # A PR that changes what SSSB hands an adopter (every `@sssb/*` package's shipped files, today the kit, and the starter) adds a changeset: its
    # release-note entry, which ADR-0014 P7's notes are assembled from. Path-based, because every package is private
    # until P14 and `changeset status` ignores private packages. The script, its exemptions and its tests:
    # .github/scripts/require-changeset.sh, tests/tooling/changesets.test.ts. A newer push to the PR re-runs it, so
    # adding the file turns it green.
    changeset-required:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The gate diffs from the merge-base and reads when the gate reached the base branch.
                  fetch-depth: 0
            - name: Require a changeset
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
                  CREATED_AT: ${{ github.event.pull_request.created_at }}
                  ACTOR: ${{ github.event.pull_request.user.login }}
                  HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
                  REPO: ${{ github.repository }}
              run: bash .github/scripts/require-changeset.sh

    # ADR-0014 P12: a new adopter's workspace, as `pnpm create @sssb` makes it. Packs every @sssb package, runs the
    # PACKED @sssb/create (extracted from its tarball, under plain Node) into a scratch directory with the tarballs as
    # its packages, installs, and runs that workspace's OWN gates with not one of its files changed: `pnpm verify`
    # (e2e and the static demo included), the unit tests and `pnpm test:contract` (on embedded Postgres) held to the
    # conformance suite, the reusable workflow's `sssb ci lint-typecheck-unit` and `sssb ci synth`, and `pnpm knip` and
    # `pnpm jscpd` (the workspace's own CI job). A required check, under the name the rulesets
    # already require. It is pack and consume's second shape (`--shape generated`), and the job below runs the first:
    # two jobs side by side rather than one running both, so each is its own required check and neither waits on the
    # other. Packing, and the install it needs, are done as in the job below, whose comment says why. The caches are keyed on the same seed (both
    # workspaces install from it) under prefixes of this job's own: the two jobs' stores hold different sets (this
    # shape installs a subset of the seed), and with one key whichever job saved first would hand the other a store
    # missing what it installs.
    adoption-probe:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            - name: locate the pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: adoption-probe-pnpm-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: adoption-probe-pnpm-${{ runner.os }}-
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: adoption-probe-playwright-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: adoption-probe-playwright-${{ runner.os }}-
            # The same install as pack-and-consume's below: packing every package needs the kit's dependencies (its
            # prepack) and the cdk's `workspace:*` link to @sssb/tools.
            - name: install the kit's dependencies, for its prepack build, and the cdk's workspace link
              run: pnpm install --frozen-lockfile --ignore-scripts --filter @sssb/kit --filter @sssb/cdk
            - run: node scripts/pack-and-consume.mjs --shape generated --dir "$RUNNER_TEMP/adoption-probe"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: adoption-probe-e2e
                  path: |
                      ${{ runner.temp }}/adoption-probe/generated/apps/*/test-results/
                      ${{ runner.temp }}/adoption-probe/generated/apps/*/playwright-report/
                  retention-days: 7

    # ADR-0014 rule 5 (P2): the framework as an adopter gets it, in the first adopter's shape. Packs every @sssb
    # package and generates a workspace outside this checkout with the PACKED @sssb/create, then shapes it like
    # safeinsights/pages: two apps with different seams linked by `link:` (the second one the generator's too), an
    # app-owned adapter, a sibling package, and a seamless importer that must fail. It installs the TARBALLS and runs
    # the script's checks over that workspace (`--shape pages`): typecheck with the strict flags, the unit and contract
    # suites from the root, doctor, check-e2e, the fences, the migrator bundles, next build and e2e. Inside this repo
    # workspace links and per-app aliases resolve the framework and the seam, which hides exactly what an adopter would
    # hit; every step's logic is in scripts/pack-and-consume.mjs, so `pnpm pack-and-consume` reproduces this job, and
    # the one above, locally.
    #
    # No `pnpm install` of the whole repo: the job needs only `pnpm pack`. Of this repo's packages only the kit has a
    # pack-time build that needs dependencies (its `prepack` compiles @sssb/kit/testing/e2e with esbuild and
    # typescript, its devDependencies; @sssb/create's builds its template with Node alone), and only the cdk has a
    # `workspace:*` dependency for the pack to resolve, so the step before the script installs those two and nothing
    # else. The consumer installs from its own committed lockfile
    # seed (scripts/pack-and-consume/consumer-lock.yaml), so its caches are keyed on that file, under prefixes of their
    # own: sharing setup-node's pnpm cache key would let this job save a store holding only the consumer's packages for
    # every other job to restore.
    pack-and-consume:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
            - name: locate the pnpm store
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pack-and-consume-pnpm-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: pack-and-consume-pnpm-${{ runner.os }}-
            # The consumer's own Playwright, pinned by the same seed, has its own browser revision.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: pack-and-consume-playwright-${{ runner.os }}-${{ hashFiles('scripts/pack-and-consume/consumer-lock.yaml') }}
                  restore-keys: pack-and-consume-playwright-${{ runner.os }}-
            # --ignore-scripts: the root's `prepare` (husky, launch-json, panda codegen) needs the whole repo installed,
            # and the pack needs no install script (esbuild's binary arrives as an optional dependency).
            # @sssb/cdk too: its `workspace:*` peer (and dev dependency) on @sssb/tools is resolved to a version when
            # packed, which needs the link an install makes.
            - name: install the kit's dependencies, for its prepack build, and the cdk's workspace link
              run: pnpm install --frozen-lockfile --ignore-scripts --filter @sssb/kit --filter @sssb/cdk
            - run: node scripts/pack-and-consume.mjs --shape pages --dir "$RUNNER_TEMP/pack-and-consume"
            # ADR-0014 P7: on a push to main, the tarballs this job just packed and tested are this run's artifact. A
            # release candidate's tag run (release.yml's `candidate`) waits for this run to pass on the release commit
            # and attaches exactly these, never a second pack. Flat, one per fixed-group package, as the script packs
            # them (side by side, the directory the generator's `--sssb` takes).
            - name: keep the tested tarballs
              if: github.event_name == 'push'
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/sssb-tarballs"
                  cp "$RUNNER_TEMP"/pack-and-consume/tarballs/*.tgz "$RUNNER_TEMP/sssb-tarballs/"
                  ls -l "$RUNNER_TEMP/sssb-tarballs"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: github.event_name == 'push'
              with:
                  name: sssb-tarballs
                  path: ${{ runner.temp }}/sssb-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  # A re-run of this job packs the same commit again; its tarballs replace the earlier attempt's, so
                  # the run's artifact is always the last attempt's, the one whose result the gate reads.
                  overwrite: true
            # On CI the starter's Playwright reporter is `github`, so the evidence on a failure is the
            # traces under test-results/ (trace: on-first-retry), not an HTML report.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: pack-and-consume-e2e
                  path: |
                      ${{ runner.temp }}/pack-and-consume/workspace/apps/*/test-results/
                      ${{ runner.temp }}/pack-and-consume/workspace/apps/*/playwright-report/
                  retention-days: 7

    # The licences of what an adopter inherits (docs/decision-log.md, "Licence scan"): the installed dependency closure of
    # every published package, the starter and the workspace root, judged against .github/licence-policy.json by
    # scripts/licence-scan.mjs: a licence the policy does not allow, an unknown one, or a stale exception fails. A
    # job of its own rather than a step of repo-checks, so a new copyleft dependency is a red check that says so. Not in
    # the rulesets' required list (that is a settings change, JP's); `release.yml` still waits for this whole workflow
    # to pass on `main`, so a licence the policy fails holds a release back until it is decided. The scan reads
    # node_modules, so the install comes first; --ignore-scripts, because licences need no install script.
    licence-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: node scripts/licence-scan.mjs --summary

    secret-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # full history — a secret committed then deleted is still leaked
            - name: gitleaks (pinned binary; gitleaks-action requires a license key for org repos)
              run: |
                  curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
                  ./gitleaks git --redact --config .gitleaks.toml
