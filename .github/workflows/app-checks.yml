# SSSB's checks for an app workspace, as a REUSABLE WORKFLOW (ADR-0014 part 7, step P10). An adopter's own workflow
# calls it beside its own jobs and triggers, pinned to a commit of safeinsights/sssb:
#
#     jobs:
#         sssb:
#             uses: safeinsights/sssb/.github/workflows/app-checks.yml@<full commit SHA>
#             permissions:
#                 contents: read
#             with:
#                 synth: ./apps/console/infra
#
# and requires the check `sssb / all-checks` (the caller's job name, then this workflow's job), which fails unless
# every job below ran and passed. SSSB's own checks.yml calls it the same way, by its local path.
#
# Orchestration only. Every job's work is one `pnpm exec sssb ci <job>` command (@sssb/tools), so it comes from the
# caller's lockfile and cannot drift from the packages the app installed; the other steps are setup, the coverage
# summary and all-checks' verdict. It takes no secrets, and a caller must not
# pass `secrets: inherit`: nothing here needs one, and none of its jobs may write. It assumes only what its inputs and
# the workspace say: a pnpm workspace at the repository's root whose root package.json depends on @sssb/tools and
# defines `lint`, `typecheck`, `test:unit` (or `test:coverage`) and `test:contract`; and apps that each have a Playwright config and a `test:e2e` script (and a `chromium` project beside a `destructive` one),
# and the scripts `build:demo-static`, `check:demo-size` and `e2e:demo-static`. A job
# that finds nothing to run fails, never passes empty, and so does one that would leave an app out.
name: sssb app checks

on:
    workflow_call:
        inputs:
            apps:
                description: >-
                    The app directories, relative to the repository root and separated by whitespace. Empty (the
                    default) means the workspace's apps: the root package.json's `sssb.apps`, or every `apps/<name>`.
                type: string
                default: ''
            synth:
                description: >-
                    A pnpm --filter selector for the infra package(s) whose `synth` script to run (CDK synth, which
                    runs the SssbApp construct's assertions), e.g. `./apps/console/infra`. Empty (the default) skips
                    the synth job, and `all-checks` then expects it skipped.
                type: string
                default: ''
            node-version-file:
                description: The file setup-node reads the Node version from.
                type: string
                default: .nvmrc

# The ceiling for every job: none needs more than a read of the repository.
permissions:
    contents: read

jobs:
    # The workspace's lint, typecheck and unit tests (in this repository the framework's seam-conformance suites run
    # among them; P5's conformance suite joins when it lands), then `sssb check-fences`
    # in each app: the fences as the app's own config composes them.
    lint-typecheck-unit:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec sssb ci lint-typecheck-unit --apps "$APPS"
              env:
                  APPS: ${{ inputs.apps }}
            # A workspace whose unit run writes Vitest's json-summary coverage report gets its totals on the run's page.
            - name: coverage summary
              if: always() && hashFiles('coverage/coverage-summary.json') != ''
              run: node -e "const s=require('./coverage/coverage-summary.json').total; console.log('| metric | % |\n|---|---|', ...Object.entries(s).map(([k,v])=>'\n| '+k+' | '+v.pct+' |'))" >> "$GITHUB_STEP_SUMMARY"

    # The same migrations and RLS proofs the unit tests run on pglite, against real Postgres: a service container, its
    # URL in CONTRACT_DATABASE_URL, and the workspace's `test:contract`.
    contract:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec sssb ci contract
              env:
                  CONTRACT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # The e2e shards and the static-demo apps, DISCOVERED from the apps (`sssb ci matrix`), never hand-listed: an app
    # that is renamed or added needs no edit here. It fails when the workspace has no apps or any app lacks a Playwright
    # config or a `build:demo-static` script, so no app drops out of either matrix and neither is ever empty (an empty
    # matrix would fail its job without saying why).
    discover:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            e2e: ${{ steps.matrix.outputs.e2e }}
            demo-static: ${{ steps.matrix.outputs.demo-static }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            # The CLI is all this job needs, and no install script has to run for it.
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - id: matrix
              run: pnpm exec sssb ci matrix --apps "$APPS"
              env:
                  APPS: ${{ inputs.apps }}

    # SHARDED, because parallelism is only safe where the worlds are separate: every Playwright worker in one shard
    # drives one server holding one `.data`, and separate runners have separate worlds. An app whose Playwright config
    # declares a `destructive` project gets two shards (`e2eShards` in @sssb/tools' `ci.js` says how).
    e2e:
        name: e2e (${{ matrix.shard.name }})
        needs: discover
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            # One red shard should not hide the others.
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.discover.outputs.e2e) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Keyed on the lockfile, which pins the Playwright version the browser build must match.
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            - run: pnpm exec playwright install --with-deps chromium
              working-directory: ${{ matrix.shard.app }}
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            # A cache hit restores the browsers but not the OS packages they link against.
            - run: pnpm exec playwright install-deps chromium
              working-directory: ${{ matrix.shard.app }}
              if: steps.playwright-cache.outputs.cache-hit == 'true'
            - run: pnpm exec sssb ci e2e --app "$APP" ${PROJECT:+--project "$PROJECT"}
              env:
                  APP: ${{ matrix.shard.app }}
                  PROJECT: ${{ matrix.shard.project }}
                  NEXT_TELEMETRY_DISABLED: '1'
                  # Against a production build rather than `next dev`: CI is cold every time, and a build up front is
                  # far faster than compiling every route on demand. The framework's run mode fails closed unless
                  # this is set explicitly.
                  E2E_BUILD: '1'
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  # Per shard, or every shard races for one artifact name and only one survives.
                  name: playwright-report-${{ matrix.shard.name }}
                  path: ${{ matrix.shard.app }}/playwright-report/
                  retention-days: 7

    # Each app's static demo: build, its own size budget, then its e2e, which drives the built shell from file://
    # with no server.
    demo-static:
        name: demo-static (${{ matrix.demo.name }})
        needs: discover
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                demo: ${{ fromJson(needs.discover.outputs.demo-static) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            - run: pnpm exec playwright install --with-deps chromium
              working-directory: ${{ matrix.demo.app }}
              if: steps.playwright-cache.outputs.cache-hit != 'true'
            - run: pnpm exec playwright install-deps chromium
              working-directory: ${{ matrix.demo.app }}
              if: steps.playwright-cache.outputs.cache-hit == 'true'
            - run: pnpm exec sssb ci demo-static --app "$APP"
              env:
                  APP: ${{ matrix.demo.app }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-report-demo-static-${{ matrix.demo.name }}
                  path: ${{ matrix.demo.app }}/playwright-report/
                  retention-days: 7
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: static-demo-${{ matrix.demo.name }}
                  path: ${{ matrix.demo.app }}/dist-demo/index.html
                  retention-days: 14

    # CDK synth of the app's infra, which runs the SssbApp construct's assertions (ADR-0014 part 8): only when the
    # caller names the infra package(s).
    synth:
        if: inputs.synth != ''
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: ${{ inputs.node-version-file }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec sssb ci synth --filter "$SYNTH"
              env:
                  SYNTH: ${{ inputs.synth }}

    # THE ONE CHECK TO REQUIRE. A skipped job reports as a passing check, and a job that never started reports nothing,
    # so requiring the jobs above one by one lets a check go missing, or pass without running, with every required
    # check still green. This job runs whatever happened above and fails unless each of them succeeded; synth may be
    # skipped only when the caller asked for no synth.
    all-checks:
        if: always()
        needs: [lint-typecheck-unit, contract, discover, e2e, demo-static, synth]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: every job ran and passed
              env:
                  NEEDS: ${{ toJson(needs) }}
                  SYNTH: ${{ inputs.synth }}
              run: |
                  node -e '
                  const needs = JSON.parse(process.env.NEEDS)
                  const expected = (job) => (job === "synth" && process.env.SYNTH === "" ? "skipped" : "success")
                  let failed = false
                  for (const job of ["lint-typecheck-unit", "contract", "discover", "e2e", "demo-static", "synth"]) {
                      const result = needs[job]?.result ?? "missing"
                      const ok = result === expected(job)
                      if (!ok) failed = true
                      console.log(`${ok ? "ok " : "BAD"} ${job}: ${result} (expected ${expected(job)})`)
                  }
                  process.exit(failed ? 1 : 0)
                  '
